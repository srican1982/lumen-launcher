<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="calendar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B7A"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="calendar-sheen" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="calendar-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#calendar-bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#calendar-sheen)"/>
  <rect x=".6" y=".6" width="62.8" height="62.8" rx="15.4" fill="none" stroke="#fff" stroke-opacity=".18"/>
  <g filter="url(#calendar-soft)">
  <rect x="13" y="16" width="38" height="36" rx="7" fill="#fff"/>
  <rect x="13" y="16" width="38" height="11" rx="7" fill="#C62828"/>
  <rect x="13" y="22" width="38" height="5" fill="#C62828"/>
  <text x="32" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#2A1A16">20</text>
</g>
</svg>
